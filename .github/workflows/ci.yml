# CI workflow for a Python repo using pytest + ruff.
# Copies the template from daily-audit-agent SkILL templates.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package + dev dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest tests/ -v
      - name: Lint
        run: python -m ruff check .
